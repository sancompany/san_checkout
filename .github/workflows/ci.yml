# CI — Lei 0: nesta classificação de projeto, teste roda sozinho a cada
# push, e push que quebra teste não entra. Autoteste que só executa
# quando alguém digita o comando na mão não é rede de proteção.
# ⚠️ AÇÃO FIXADA POR SHA, NÃO POR TAG. `@v4` é referência móvel: quem
# controla a ação repointa a tag em silêncio e o CI passa a rodar outro
# código com a credencial deste repositório — foi assim no trivy-action e
# no kics-github-action. O comentário ao lado diz qual versão o SHA é, para
# a atualização continuar legível. SHAs conferidos na API do GitHub em
# 13/09/2026.

name: testes

on:
  push:
  pull_request:

# O token do CI só LÊ (SEC-034, 25/09/2026). Sem esta linha, as permissões
# são as padrão do repositório — que podem ser de escrita — num job que
# roda `npm ci`, isto é, código de terceiros.
permissions:
  contents: read

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      # `check`, e não `test`: o `check` roda a análise de sintaxe de TODO
      # JS — incluindo `public/js/`, que suíte nenhuma alcança — e só
      # depois as suítes. Até 18/09/2026 este passo era `npm test`, então
      # um erro de sintaxe no código do comprador passava pelo portão que
      # autoriza o deploy. O `RUNBOOK` §3 já mandava rodar `npm run check`
      # "a mesma porta que o CI roda": o documento estava certo e o CI é
      # que não era.
      #
      # Sem segredo nenhum: os autotestes são puros e o runner injeta
      # valores falsos só para os módulos carregarem (ver tests/executar.js).
      - run: npm run check
