# Verificações automáticas de segurança — trabalho da Estação 3.
#
# POR QUE AQUI E NÃO NA ESTAÇÃO 6
# Ferramenta que depende de alguém lembrar de rodar não roda. E ligadas
# só na prontidão, estas três descobrem na véspera do lançamento o que
# descobririam na primeira semana.
#
# O agendamento semanal não é excesso: vulnerabilidade é publicada sem o
# seu código mudar. Sem execução periódica, um projeto parado há dois
# meses tem dois meses de exposição não vista.
# ⚠️ AÇÃO FIXADA POR SHA, NÃO POR TAG. `@v4` é referência móvel: quem
# controla a ação repointa a tag em silêncio e o CI passa a rodar outro
# código com a credencial deste repositório — foi assim no trivy-action e
# no kics-github-action. O comentário ao lado diz qual versão o SHA é, para
# a atualização continuar legível. SHAs conferidos na API do GitHub em
# 13/09/2026.

name: Segurança

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 9 * * 1'   # toda segunda, 06:00 em Brasília

permissions:
  contents: read

jobs:
  # -------------------------------------------------------------------
  # 1. Dependência vulnerável.
  #
  # `--audit-level=high` e não `moderate`: em 12/09/2026 o projeto tinha
  # 3 moderadas (`qs`, via body-parser e express) e nenhuma alta. Falhar
  # em moderate quebraria a CI hoje, no primeiro push, por algo que não
  # é exploração remota — e CI que quebra por ruído é CI que o time
  # aprende a ignorar. As moderadas continuam visíveis na saída.
  # As três do `qs` foram resolvidas em 25/09/2026 (SEC-034/SEC-033, com
  # `npm audit fix` SEM `--force`: express 4.22.3, body-parser 1.20.8,
  # qs 6.16.0) — `npm audit` saiu com zero. O portão continua em `high`.
  # -------------------------------------------------------------------
  dependencias:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high

  # -------------------------------------------------------------------
  # 2. Segredo no histórico.
  #
  # `fetch-depth: 0` é o que faz esta verificação existir: sem ele o
  # checkout traz um commit só, e a varredura perde exatamente o que ela
  # procura — credencial que entrou há seis meses e foi "apagada" depois.
  #
  # `--redact` impede que o log da própria verificação imprima o segredo
  # achado. Sem isso o achado vaza no log do CI, que é mais visível que o
  # commit original.
  #
  # O binário é baixado direto em vez de usar a ação do marketplace
  # porque aquela exige licença em repositório de organização.
  #
  # ⚠️ ACHANDO ALGO, O CAMINHO É REVOGAR, NÃO APAGAR. Reescrever
  # histórico não alcança clone, fork nem cache de quem já baixou — e
  # este repositório já teve o histórico reescrito uma vez
  # (docs/erros/2026-09-11-filter-repo-apagou-trabalho-nao-commitado.md).
  # -------------------------------------------------------------------
  segredos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4
        with:
          fetch-depth: 0
      # O binário é conferido pelo SHA-256 antes de rodar (SEC-034,
      # 25/09/2026): baixado e executado sem conferência, ele era a mesma
      # referência móvel que a fixação das ações por SHA existe para
      # evitar. O valor é o do `gitleaks_8.28.0_checksums.txt` da própria
      # release, e bateu com o SHA-256 do pacote baixado em 25/09/2026.
      # Versão nova: trocar os DOIS, conferindo contra o checksums dela.
      - name: Instalar gitleaks
        run: |
          VERSAO=8.28.0
          SHA256=a65b5253807a68ac0cafa4414031fd740aeb55f54fb7e55f386acb52e6a840eb
          curl -sSL -o gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${VERSAO}/gitleaks_${VERSAO}_linux_x64.tar.gz"
          echo "${SHA256}  gitleaks.tar.gz" | sha256sum --check --strict
          tar -xzf gitleaks.tar.gz gitleaks
      - run: ./gitleaks detect --source . --redact --exit-code 1

  # -------------------------------------------------------------------
  # 3. Análise estática — padrão perigoso repetido que passa na leitura.
  # -------------------------------------------------------------------
  estatica:
    runs-on: ubuntu-latest
    # Imagem fixada por DIGEST (SEC-034, 25/09/2026): `semgrep/semgrep` sem
    # nada é a `latest`, outra referência móvel — e ela roda com o código
    # do repositório montado. O digest é o da `1.177.0`, que era a
    # `latest` no Docker Hub em 25/09/2026.
    container: semgrep/semgrep:1.177.0@sha256:acaac22ffc7b7cc5926de0751b223bce0b2491c33d18422fa72f632c78d81198
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4
      - run: semgrep scan --config p/owasp-top-ten --config p/secrets --error
